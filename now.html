<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Now — Dami Media Book</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020403">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #060509;
    color: #E0D8F0;
    min-height: 100vh;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .title {
    font-family: Georgia, serif; font-size: 20px; font-style: italic;
    color: #D4A574;
  }
  .open-app {
    background: none; border: 1px solid #3D3050; color: #C9A4F0;
    padding: 8px 14px; border-radius: 8px; font-size: 12px;
    cursor: pointer; text-decoration: none;
  }
  .open-app:hover { border-color: #C9A4F0; }
  .card {
    background: #15101D; border: 1px solid #2A2138; border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: center;
    cursor: pointer;
  }
  .card:active { border-color: #D4A574; }
  .cover {
    width: 44px; height: 62px; border-radius: 8px;
    background: #100C16; border: 1px solid #2A2138;
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex: 0 0 auto;
  }
  .info { flex: 1; min-width: 0; }
  .name {
    font-family: Georgia, serif; font-size: 16px; color: #E0D8F0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress {
    font-family: 'Courier New', monospace; font-size: 11px;
    color: #D4A574; margin-top: 3px;
  }
  .bar {
    height: 5px; background: #100C16; border-radius: 999px;
    overflow: hidden; margin-top: 8px;
  }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #D4A574, #C9A961);
  }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .quick-btn {
    flex: 1; background: #100C16; border: 1px solid #2A2138;
    border-radius: 6px; color: #8A7DA0; font-size: 11px;
    padding: 8px 4px; cursor: pointer; font-family: 'Courier New', monospace;
  }
  .quick-btn:active { border-color: #D4A574; color: #D4A574; }
  .empty {
    text-align: center; color: #5A5070; padding: 40px 20px;
    font-size: 14px; line-height: 1.6;
  }
  .empty a { color: #C9A4F0; }
</style>
</head>
<body>
<div class="header">
  <div class="title">📌 Now</div>
  <a href="./" class="open-app">Open full app →</a>
</div>
<div id="list"></div>

<script>
  const DB_NAME = 'damillami-backlog';
  const DB_VERSION = 1;
  const STORAGE_KEY = 'gameledger:v1';
  const ICONS = { game: '🎮', movie: '🎬', tv: '📺', book: '📚', album: '💿' };

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function loadGames() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(STORAGE_KEY);
      req.onsuccess = () => {
        try {
          const data = typeof req.result === 'string' ? JSON.parse(req.result) : req.result;
          resolve(data && Array.isArray(data.games) ? data.games : []);
        } catch (e) { resolve([]); }
      };
      req.onerror = () => resolve([]);
    });
  }

  async function saveGames(games) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(JSON.stringify({ games, savedAt: Date.now() }), STORAGE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function getProgress(g) {
    const mt = g.mediaType || 'game';
    let text = '', pct = 0;
    if (mt === 'tv' && (g.currentSeason || g.currentEpisode)) {
      text = `S${g.currentSeason || '?'}${g.currentEpisode ? 'E' + g.currentEpisode : ''}`;
      if (g.totalSeasons) { text += ` / ${g.totalSeasons} seasons`; pct = Math.min(100, ((g.currentSeason || 0) / g.totalSeasons) * 100); }
    } else if (mt === 'book' && g.currentPage) {
      text = `Page ${g.currentPage}`;
      if (g.pageCount) { text += ` / ${g.pageCount}`; pct = Math.min(100, (g.currentPage / g.pageCount) * 100); }
    } else if (mt === 'game' && g.hoursPlayed) {
      text = `${g.hoursPlayed}h played`;
    }
    return { text, pct };
  }

  let allGames = [];

  async function increment(id, field, amount) {
    const g = allGames.find(x => x.id === id);
    if (!g) return;
    g[field] = Math.max(0, (typeof g[field] === 'number' ? g[field] : 0) + amount);
    g.updatedAt = Date.now();
    await saveGames(allGames);
    renderList();
  }

  async function markDone(id) {
    const g = allGames.find(x => x.id === id);
    if (!g) return;
    g.status = 'played';
    g.completedAt = g.completedAt || Date.now();
    g.updatedAt = Date.now();
    await saveGames(allGames);
    renderList();
  }

  function renderList() {
    const el = document.getElementById('list');
    const inProgress = allGames.filter(g => {
      const s = (g.status || '').toLowerCase();
      return s === 'in-progress' || s === 'playing' || s === 'watching' || s === 'reading' || s === 'listening';
    });

    if (inProgress.length === 0) {
      el.innerHTML = '<div class="empty">Nothing in progress right now.<br><a href="./">Open the app</a> to start something.</div>';
      return;
    }

    el.innerHTML = inProgress.map(g => {
      const mt = g.mediaType || 'game';
      const { text, pct } = getProgress(g);
      const cover = g.coverUrl
        ? `<div class="cover" style="background-image:url('${g.coverUrl}')"></div>`
        : `<div class="cover">${ICONS[mt] || '📦'}</div>`;

      let btns = '';
      if (mt === 'tv') btns = `<button class="quick-btn" onclick="increment('${g.id}','currentEpisode',1)">+1 ep</button><button class="quick-btn" onclick="increment('${g.id}','currentSeason',1)">+1 season</button>`;
      else if (mt === 'book') btns = `<button class="quick-btn" onclick="increment('${g.id}','currentPage',20)">+20 pg</button><button class="quick-btn" onclick="increment('${g.id}','currentPage',50)">+50 pg</button>`;
      else if (mt === 'game') btns = `<button class="quick-btn" onclick="increment('${g.id}','hoursPlayed',1)">+1h</button><button class="quick-btn" onclick="increment('${g.id}','hoursPlayed',0.5)">+30m</button>`;
      btns += `<button class="quick-btn" onclick="markDone('${g.id}')">✓ Done</button>`;

      return `
        <div class="card" onclick="window.location='./'">
          ${cover}
          <div class="info">
            <div class="name">${g.title || 'Untitled'}</div>
            ${text ? `<div class="progress">${text}</div>` : ''}
            ${pct > 0 ? `<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>` : ''}
            <div class="actions" onclick="event.stopPropagation();">${btns}</div>
          </div>
        </div>`;
    }).join('');
  }

  (async () => {
    allGames = await loadGames();
    renderList();
  })();
</script>
</body>
</html>
